# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 📱 iOS release

# Builds the iOS app with the same scripts as a local release (app/scripts/ios-*.sh)
# and, when asked, uploads the build to App Store Connect (TestFlight).
# Required secrets are documented in app/docs/ios.md.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to App Store Connect (TestFlight)"
        type: boolean
        default: false

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: 🧾 Check the release request
        # Fail in seconds rather than after a 30 minute build. An unset secret expands to
        # an empty string: the build would stay green and ship an app without crash
        # reporting, or unable to verify OTA updates. Only presence is exposed here.
        working-directory: ${{ github.workspace }}
        env:
          UPLOAD: ${{ inputs.upload }}
          HAS_ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID != '' }}
          HAS_ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID != '' }}
          HAS_ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 != '' }}
          HAS_IOS_DEV_CERT_P12_B64: ${{ secrets.IOS_DEV_CERT_P12_B64 != '' }}
          HAS_IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD != '' }}
          HAS_SENTRY_URL: ${{ secrets.SENTRY_URL != '' }}
          HAS_SENTRY_ORG: ${{ secrets.SENTRY_ORG != '' }}
          HAS_SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT != '' }}
          HAS_SENTRY_DSN: ${{ secrets.SENTRY_DSN != '' }}
          HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
          HAS_IOS_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 != '' }}
          HAS_EXPO_UPDATES_CERTIFICATE: ${{ secrets.EXPO_UPDATES_CERTIFICATE != '' }}
        run: |
          status=0
          for name in ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8 IOS_DEV_CERT_P12_B64 \
            IOS_DEV_CERT_PASSWORD SENTRY_URL SENTRY_ORG SENTRY_PROJECT SENTRY_DSN SENTRY_AUTH_TOKEN \
            IOS_GOOGLE_SERVICE_INFO_PLIST_B64 EXPO_UPDATES_CERTIFICATE; do
            present="HAS_$name"
            if [ "${!present}" != "true" ]; then
              echo "::error::Repository secret $name is not set"
              status=1
            fi
          done
          # Only a manual run on the default branch may publish: say so instead of
          # silently skipping the upload.
          if [ "$UPLOAD" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Uploading to App Store Connect is only allowed from main (this run is on $GITHUB_REF_NAME)"
            status=1
          fi
          exit "$status"

      - name: ⏬ Checkout code repository
        uses: actions/checkout@v4

      - name: 🧰 Select Xcode 26
        # Expo SDK 54 / React Native 0.81 does not adopt the UIScene life cycle required
        # by the iOS 27 SDK: an app built with Xcode 27 aborts at launch.
        run: |
          # Latest released 26.x on the runner; beta and release-candidate builds are
          # skipped, App Store Connect rejects uploads made with them.
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|rc|candidate' | sort -V | tail -n 1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No released Xcode 26.x found on this runner"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version

      - name: ⬢ Setup node version
        uses: actions/setup-node@v4
        with:
          node-version-file: app/.node-version

      - name: 🧶 Enable Yarn
        run: corepack enable

      - name: ⛾ Yarn cache
        uses: actions/cache@v4
        with:
          path: |
            app/.yarn/cache
            app/scripts/useful-places/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock', 'app/scripts/useful-places/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: 🔽 Yarn install
        run: |
          yarn install --immutable
          yarn --cwd scripts/useful-places install --immutable

      - name: 🔐 Restore build configuration
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}
          EXPO_UPDATES_CERTIFICATE: ${{ secrets.EXPO_UPDATES_CERTIFICATE }}
        run: |
          set -euo pipefail
          umask 077

          # App Store Connect API key, where altool and the release scripts expect it.
          mkdir -p "$HOME/.private_keys"
          key_path="$HOME/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key_path"

          # .env.prod: public values from the example, then the per-environment ones.
          # The release scripts `source` it, so later lines win. The leading empty line
          # keeps the first value from being glued to the last line of the example.
          cp .env.prod.example .env.prod
          {
            echo
            echo "SENTRY_URL=$SENTRY_URL"
            echo "SENTRY_ORG=$SENTRY_ORG"
            echo "SENTRY_PROJECT=$SENTRY_PROJECT"
            echo "SENTRY_DSN=$SENTRY_DSN"
            echo "ASC_API_KEY_ID=$ASC_API_KEY_ID"
            echo "ASC_API_ISSUER_ID=$ASC_API_ISSUER_ID"
            echo "ASC_API_KEY_PATH=$key_path"
          } >> .env.prod

          # Firebase configuration (git-ignored).
          echo "$IOS_GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/GoogleService-Info.plist
          cp ios/GoogleService-Info.plist ios/AlerteSecours/GoogleService-Info.plist

          # Public certificate used by expo-updates to verify signed OTA updates.
          mkdir -p keys
          printf '%s\n' "$EXPO_UPDATES_CERTIFICATE" > keys/certificate.pem

      - name: ⛾ CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: 🫛 Install Pods
        working-directory: app/ios
        run: pod install

      - name: 📲 Ensure the iOS platform is installed
        # xcodebuild refuses iOS destinations until the platform matching its SDK is installed.
        run: |
          # Capture the output first: piping straight into `grep -q` under pipefail could
          # misreport when grep exits before xcodebuild is done writing.
          destinations() {
            xcodebuild -workspace ios/AlerteSecours.xcworkspace -scheme AlerteSecours -showdestinations 2>&1 || true
          }
          # Only the generic device entry matters; other entries (simulators, toolchains)
          # may carry their own "is not installed" message.
          device_entry() {
            grep "name:Any iOS Device" <<< "$1" || true
          }
          available=$(destinations)
          if grep -q "is not installed" <<< "$(device_entry "$available")"; then
            xcodebuild -downloadPlatform iOS
            available=$(destinations)
          fi
          # An eligible entry ends right after the name; an ineligible one carries an error.
          if ! grep -q "name:Any iOS Device }" <<< "$available"; then
            echo "::error::xcodebuild cannot build for iOS devices on this runner"
            tail -n 20 <<< "$available"
            exit 1
          fi

      - name: 🔏 Import the development signing certificate
        # The archive is signed with a development identity; the App Store distribution
        # certificate is cloud-managed and used through the API key at export time.
        env:
          IOS_DEV_CERT_P12_B64: ${{ secrets.IOS_DEV_CERT_P12_B64 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/ios-build.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$IOS_DEV_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security import "$RUNNER_TEMP/dev.p12" -k "$keychain" -f pkcs12 -P "$IOS_DEV_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dev.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # An expired certificate still imports. Without a valid identity xcodebuild would
          # ask Apple for a brand new development certificate on every run: stop here.
          identities=$(security find-identity -v -p codesigning "$keychain")
          echo "$identities"
          if ! grep -qE '^ +[1-9][0-9]* valid identities found' <<< "$identities"; then
            echo "::error::The development certificate in IOS_DEV_CERT_P12_B64 is not valid (expired?). See app/docs/ios.md"
            exit 1
          fi

      - name: 🗺 Build the useful places database
        # Downloads public datasets, one of them around 200 MB: retry a dropped transfer
        # instead of failing the whole release. Files already fetched are not downloaded
        # again, and `yarn bundle:ios:build` then finds a fresh database.
        run: |
          built=0
          for attempt in 1 2 3; do
            if yarn useful-places:ensure; then
              built=1
              break
            fi
            echo "::warning::useful places build failed (attempt $attempt of 3)"
            sleep 20
          done
          if [ "$built" != "1" ]; then
            echo "::error::Could not build the useful places database"
            exit 1
          fi
          # The pipeline only warns when the defibrillator dataset cannot be parsed and
          # still writes a database. Never ship one without them.
          dae=$(sqlite3 src/assets/db/useful-places.db "select count(*) from useful_places where type = 'dae'")
          echo "Defibrillators in the database: $dae"
          if [ "${dae:-0}" -lt 100000 ]; then
            echo "::error::Only $dae defibrillators in the useful places database (expected more than 100000)"
            exit 1
          fi

      - name: 📦 Build the archive and the IPA
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: yarn bundle:ios:build

      - name: 🎁 Upload the build to App Store Connect
        # Only a manual run on the default branch may publish (enforced in the first step).
        if: ${{ inputs.upload && github.ref == 'refs/heads/main' }}
        run: yarn bundle:ios:upload

      - name: 🧹 Remove signing material
        if: always()
        # Runs from the workspace root: the app directory does not exist when the job
        # stopped before the checkout.
        working-directory: ${{ github.workspace }}
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-build.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.private_keys" app/.env.prod app/keys \
            app/ios/GoogleService-Info.plist app/ios/AlerteSecours/GoogleService-Info.plist
