# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - "**"
      - "!app/**"
    tags:
      - "**"

jobs:
  build:
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    runs-on: ubuntu-latest
    # Forgejo's OIDC opt-in: the runner injects ACTIONS_ID_TOKEN_REQUEST_URL only when the
    # job declares this — NOT GitHub's `permissions: id-token: write`. buildd verifies the
    # minted token and binds the build (and its cache identity) to the repository claim.
    enable-openid-connect: true
    container:
      image: devthefuture/act-runner:latest
    strategy:
      matrix:
        build:
          - name: hasura
            dockerfile: ./services/hasura/Dockerfile
          - name: api
            dockerfile: ./services/api/Dockerfile
          - name: files
            dockerfile: ./services/files/Dockerfile
          - name: tasks
            dockerfile: ./services/tasks/Dockerfile
          - name: watchers
            dockerfile: ./services/watchers/Dockerfile
          - name: web
            dockerfile: ./services/web/Dockerfile
          - name: app
            dockerfile: ./services/app/Dockerfile
    steps:
      - name: ⏬ Checkout code repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.M8A_ORG_BOT_REPO_TOKEN }} # Required for private repositories to works consistently, avoiding random errors

      - name: 📌 Extract metadata (tags, labels) for Docker
        id: meta
        uses: https://git.devthefuture.org/devthefuture/docker-metadata-action@v5
        with:
          images: git.devthefuture.org/${{ github.repository }}/${{ matrix.build.name }}
          tags: |
            type=semver,pattern={{version}},priority=900
            type=sha,priority=890
            type=ref,event=branch,priority=600
            type=ref,event=pr,priority=600
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }},priority=200

      - name: 🔑 Registry login
        # The build runs on the remote daemon; push auth travels from the client's docker
        # config over the buildx session — no local docker daemon involved.
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login git.devthefuture.org -u "org-bot-${{ github.repository_owner }}" --password-stdin
        env:
          REGISTRY_PASSWORD: ${{ secrets.M8A_ORG_BOT_PACKAGE_TOKEN }}

      - name: 📦 Build and push via buildkit-operator
        # Fetched from our own forge (devthefuture/buildkit-operator, a public pull mirror of
        # SocialGouv/buildkit-operator, auto-synced) — no cross-forge github.com dependency at
        # run time. Pinned to the immutable commit of v0.21.0, the buildd/companion version
        # deployed on the cluster; `@v1` is a moving tag. Bump this SHA with the operator chart.
        uses: https://git.devthefuture.org/devthefuture/buildkit-operator/forgejo@42071022f7c68070aeba92e8c30e95d8564eeb53 # v0.21.0
        with:
          buildd-url: ${{ vars.BUILDKIT_OPERATOR_BUILDD_URL }}
          ca: ${{ secrets.BUILDKIT_OPERATOR_CA }}
          cert: ${{ secrets.BUILDKIT_OPERATOR_CERT }}
          key: ${{ secrets.BUILDKIT_OPERATOR_KEY }}
          name: ${{ matrix.build.name }} # monorepo component → its own daemon + cache
          context: ${{ matrix.build.context || '.' }}
          file: ${{ matrix.build.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: "true"

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: devthefuture/act-runner:latest@sha256:f326ce2f586d4f55757b87d3de7baf29715ef6cbc5af7bdf6313bcf7a90e7b3d
    steps:
      - name: 🎡 Check out the Helm chart repository
        uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/appsets"
          token: ${{ secrets.M8A_ORG_BOT_REPO_TOKEN }}
          ref: "main"

      - name: 🚀 Upgrade images tag
        uses: https://git.devthefuture.org/devthefuture/actions/uptag@v0.2.3
        with:
          app: |
            ---
            name: hasura
            key: graphql-engine.image.tag
            ---
            name: api
            key: modjo-microservice.image.tag
            ---
            name: files
            key: modjo-microservice.image.tag
            ---
            name: tasks
            key: modjo-microservice.image.tag
            ---
            name: watchers
            key: modjo-microservice.image.tag
            ---
            name: app
            key: nginx.image.tag
            ---
          env: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'staging' }}
          meta-tags: ${{ needs.build.outputs.tags }}
          commit: "true"
          push: "true"
